name: OpenHumanoid CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy

    - name: Lint with flake8
      run: |
        flake8 control/ simulation/ perception/ ai_models/ utils/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 control/ simulation/ perception/ ai_models/ utils/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check control/ simulation/ perception/ ai_models/ utils/

    - name: Type check with mypy
      run: |
        mypy control/ simulation/ perception/ --ignore-missing-imports

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=control --cov=simulation --cov=perception --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  urdf-validation:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liburdfdom-tools

    - name: Validate URDF
      run: |
        check_urdf design/open_humanoid_v1.urdf

    - name: URDF consistency check
      run: |
        python3 -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('design/open_humanoid_v1.urdf')
        root = tree.getroot()
        joints = root.findall('joint')
        links = root.findall('link')
        print(f'Joints: {len(joints)}, Links: {len(links)}')
        assert len(joints) == 30, f'Expected 30 joints, got {len(joints)}'
        print('URDF validation passed')
        "

  docker-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t open_humanoid:test .

    - name: Test Docker container
      run: |
        docker run --rm open_humanoid:test python3 -c "import numpy; print('Container OK')"
